name: CI

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  run_style_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: env.yml
          init-shell: bash
      - run: pycodestyle $(git ls-files '*.py')
        shell: bash -l {0}

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: env.yml
          init-shell: bash
          cache-environment: false

      - name: Install phi4lattice package
        run: python -m pip install --no-deps -e .
        shell: bash -l {0}
      - name: Run unit tests
        run: |
          python -m pytest -q tests/unit_tests
        shell: bash -l {0}



  run_func_hmc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: env.yml
          init-shell: bash
      - name: Install phi4lattice package
        run: python -m pip install --no-deps -e .
        shell: bash -l {0}
      - run: bash tests/func_tests/test_run_hmc.sh
        shell: bash -l {0}


